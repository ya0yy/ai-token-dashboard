services:
  ai-token-dashboard:
    build: .
    image: "${AI_TOKEN_DASHBOARD_IMAGE:-ghcr.io/ya0yy/ai-token-dashboard:latest}"
    container_name: ai-token-dashboard
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    env_file: .env
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
