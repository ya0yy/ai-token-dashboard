name: CI and Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main 的部署开始后允许它完成，避免新提交在容器切换中途取消 SSH。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm test

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: token_test
          POSTGRES_PASSWORD: token_test
          POSTGRES_DB: token_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U token_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: token_test
          MYSQL_DATABASE: token_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptoken_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/remote-db.test.mjs
        env:
          TEST_POSTGRES_URL: postgresql://token_test:token_test@127.0.0.1:5432/token_test
          TEST_MYSQL_URL: mysql://root:token_test@127.0.0.1:3306/token_test

  client-scripts:
    name: 客户端安装脚本检查
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 检查Python语法和安装参数
        run: |
          python -m py_compile install.py run.py
          python install.py --help
          python run.py --help

  publish-image:
    name: 构建并发布多架构镜像
    needs: [build-and-test, browser-regression, dependency-audit, database-integration, client-scripts]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: 检出已通过检查的源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 启用ARM64构建支持
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: 配置Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 登录GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签和来源信息
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=AI Token Dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: 构建并推送amd64和arm64镜像
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-token-dashboard
          cache-to: type=gha,mode=max,scope=ai-token-dashboard
      - name: 验证已发布的镜像清单
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: 记录镜像发布结果
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### 镜像已发布'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            printf '镜像摘要：`%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-tom:
    name: 自动部署到 tom
    needs: publish-image
    # 标签仍发布镜像，只有 main 的成功构建可以更新线上服务。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: tom
      url: ${{ vars.DASHBOARD_URL }}
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - name: 使用专用密钥部署本次构建的镜像
        shell: bash
        run: |
          set -euo pipefail
          for variable in SSH_HOST SSH_PORT SSH_USER SSH_KNOWN_HOSTS DEPLOY_PATH DASHBOARD_URL SSH_PRIVATE_KEY; do
            if [[ -z "${!variable}" ]]; then
              printf '错误：tom Environment 缺少配置，变量：%s。请检查 Variables 或 Secrets。\n' "$variable" >&2
              exit 1
            fi
          done
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '错误：镜像发布作业未返回有效摘要，停止部署。' >&2
            exit 1
          fi
          if [[ ! "$SSH_HOST" =~ ^[a-zA-Z0-9._:-]+$ || ! "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ || ! "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo '错误：SSH 主机、用户名或端口格式不正确，请检查 tom Environment。' >&2
            exit 1
          fi

          # 密钥仅写入 Runner 临时目录；结束时清理，不上传到日志或产物。
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/tom-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/key" > /dev/null
          known_host="$SSH_HOST"
          if [[ "$SSH_PORT" != 22 ]]; then known_host="[$SSH_HOST]:$SSH_PORT"; fi
          if ! ssh-keygen -F "$known_host" -f "$ssh_dir/known_hosts" > /dev/null; then
            echo '错误：SSH_KNOWN_HOSTS 中没有目标主机记录，请通过可信连接核对 SSH 主机公钥。' >&2
            exit 1
          fi

          image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          printf '开始部署，镜像：%s，提交：%s\n' "$image" "$DEPLOY_REVISION"
          # 服务端通过 authorized_keys 强制进入固定部署入口，仅接受这三行数据。
          printf '%s\n' "$image" "$DEPLOY_PATH" "$DEPLOY_REVISION" |
            timeout --kill-after=10s 600s ssh -T \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ConnectTimeout=10 -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$ssh_dir/key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"

      - name: 验证公网 HTTPS 控制台
        shell: bash
        run: |
          set -euo pipefail
          # 控制台启用了鉴权，未携带密码时必须返回 401。
          status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$DASHBOARD_URL")
          if [[ "$status" != 401 ]]; then
            printf '错误：公网控制台响应异常，HTTP 状态：%s。请检查 tom 容器和 webserver 反向代理。\n' "$status" >&2
            exit 1
          fi
          printf '公网 HTTPS 控制台验证通过，HTTP 状态：%s\n' "$status"
          {
            echo '### tom 部署成功'
            printf '镜像：`%s@%s`\n\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
            printf '提交：`%s`\n\n' "$DEPLOY_REVISION"
            printf '控制台：%s，HTTP 状态：%s\n' "$DASHBOARD_URL" "$status"
          } >> "$GITHUB_STEP_SUMMARY"
