# 看板公网入口：HTTP 请求统一转到 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name tks.420114.xyz;

    return 301 https://tks.420114.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tks.420114.xyz;

    include /etc/nginx/conf.d/snippets/ssl-420114.xyz.conf;

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;
    client_max_body_size 50m;

    # 复用看板原有登录鉴权，转发到只监听本机的 Docker 服务。
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        include /etc/nginx/conf.d/snippets/general-pass_proxy.conf;
    }
}
